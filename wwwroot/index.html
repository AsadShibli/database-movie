<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reaction Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-5xl mx-auto px-4 py-10">
    <div id="catalog-view">
    <h1 class="text-3xl font-bold mb-6">Reaction Catalog</h1>
    <p class="text-slate-400 text-sm mb-6"><a class="text-indigo-400" href="/extension-test.html">Extension test simulator</a></p>

    <!-- Search movies by title -->
    <form id="search-form" class="flex gap-2 mb-8">
      <input id="search-input" type="search" placeholder="Search movies..."
        class="flex-1 rounded-lg bg-slate-900 border border-slate-700 px-4 py-2" />
      <button type="submit" class="rounded-lg bg-indigo-500 px-4 py-2 font-medium">Search</button>
    </form>

    <section id="movie-results" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></section>

    <!-- Hidden-in-plain-sight admin ingest (not a primary UI control). -->
    <footer class="mt-16 pt-6 border-t border-slate-800 text-xs text-slate-500">
      <form id="ingest-form" class="flex gap-2 items-center">
        <input id="ingest-url" type="url" placeholder="YouTube URL"
          class="flex-1 bg-transparent border-b border-slate-800 px-1 py-1" />
        <button type="submit" class="text-slate-600">Ingest</button>
      </form>
      <p id="ingest-status" class="mt-2 hidden rounded-md px-3 py-2 text-sm"></p>
    </footer>
    </div>

    <section id="movie-details-view" class="hidden">
      <button id="back-to-catalog" type="button" class="mb-6 text-indigo-300 hover:text-indigo-200">← Back to Catalog</button>
      <header class="mb-8">
        <h2 id="details-title" class="text-3xl font-bold"></h2>
        <p id="details-year" class="text-slate-400 mt-1"></p>
        <p id="details-count" class="mt-3"></p>
      </header>
      <input type="text" id="reaction-filter-input"
        placeholder="🔍 Search or paste YouTube URL to filter reactions..."
        class="w-full mb-6 rounded-lg bg-slate-900 border border-slate-700 px-4 py-2 text-slate-100 placeholder:text-slate-500" />
      <div id="reaction-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <!-- Popup modal replaced by #movie-details-view (kept for reference).
  <div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-start justify-center p-6 overflow-y-auto">
    ...
  </div>
  -->

  <script>
    const resultsEl = document.getElementById("movie-results");
    const catalogView = document.getElementById("catalog-view");
    const detailsView = document.getElementById("movie-details-view");
    let currentMovieReactions = [];

    function youtubeId(url) {
      const m = (url || "").match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : "";
    }

    function renderReactionCards(reactions) {
      const grid = document.getElementById("reaction-grid");
      if (!reactions.length) {
        grid.innerHTML = `<p class="text-slate-400 col-span-full">No reactions processed yet.</p>`;
        return;
      }
      grid.innerHTML = reactions.map((reaction) => {
        const id = youtubeId(reaction.youTubeUrl);
        return `<article class="rounded-xl overflow-hidden border border-slate-700 bg-slate-900 flex flex-col">
          ${id ? `<img class="w-full aspect-video object-cover" src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="">` : ""}
          <div class="p-4 flex flex-col gap-3 flex-1">
            <p class="font-medium">${reaction.title}</p>
            <p class="text-sm text-slate-400">${reaction.reactorName}</p>
            <div class="mt-auto flex flex-wrap gap-2">
              <a class="inline-block rounded-lg bg-red-600 hover:bg-red-500 px-3 py-1.5 text-sm font-medium"
                 href="${reaction.youTubeUrl}" target="_blank" rel="noopener">Watch on YouTube</a>
              ${reaction.patreonUrl ? `<a class="inline-block rounded-lg bg-orange-500 hover:bg-orange-400 px-3 py-1.5 text-sm font-medium"
                 href="${reaction.patreonUrl}" target="_blank" rel="noopener">Support on Patreon</a>` : ""}
            </div>
          </div>
        </article>`;
      }).join("");
    }

    document.getElementById("back-to-catalog").addEventListener("click", () => {
      detailsView.classList.add("hidden");
      catalogView.classList.remove("hidden");
    });

    document.getElementById("search-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = document.getElementById("search-input").value;
      const res = await fetch(`/api/Movies/search?q=${encodeURIComponent(q)}`);
      if (!res.ok) { resultsEl.innerHTML = `<p class="text-red-400">Search failed (${res.status}).</p>`; return; }
      const movies = await res.json();
      resultsEl.innerHTML = movies.map((m) => `
        <button data-id="${m.id}" class="text-left rounded-xl bg-slate-900 border border-slate-700 p-4 hover:border-indigo-400">
          <h3 class="font-semibold">${m.title}</h3>
          <p class="text-slate-400 text-sm">${m.releaseYear}</p>
          <p class="text-indigo-300 text-sm mt-2">${m.reactionVideoCount} Reactions Available</p>
        </button>`).join("") || `<p class="text-slate-400">No movies found.</p>`;
    });

    resultsEl.addEventListener("click", async (e) => {
      const card = e.target.closest("[data-id]");
      if (!card) return;
      const res = await fetch(`/api/Movies/${card.dataset.id}/reactions`);
      if (!res.ok) return;
      const data = await res.json();
      currentMovieReactions = data.reactionVideos || [];
      const count = currentMovieReactions.length;
      document.getElementById("details-title").textContent = data.title || "Movie";
      document.getElementById("details-year").textContent = data.releaseYear ? `Released ${data.releaseYear}` : "";
      document.getElementById("details-count").innerHTML =
        `<span class="inline-flex items-center rounded-full bg-indigo-500/20 text-indigo-200 text-sm px-3 py-1">${count} Total Reactions Available</span>`;
      document.getElementById("reaction-filter-input").value = "";
      renderReactionCards(currentMovieReactions);
      catalogView.classList.add("hidden");
      detailsView.classList.remove("hidden");
    });

    document.getElementById("reaction-filter-input").addEventListener("input", (e) => {
      const q = (e.target.value || "").toLowerCase();
      const filtered = currentMovieReactions.filter((v) =>
        (v.title || "").toLowerCase().includes(q)
        || (v.youTubeUrl || "").toLowerCase().includes(q)
        || (v.reactorName || "").toLowerCase().includes(q));
      renderReactionCards(filtered);
    });

    // document.getElementById("modal-close").addEventListener("click", () => modal.classList.add("hidden"));

    document.getElementById("ingest-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = document.getElementById("ingest-url").value;
      const status = document.getElementById("ingest-status");
      const res = await fetch(`/api/Ingestion/ingest?url=${encodeURIComponent(url)}`, {
        method: "POST",
        headers: { "x-api-key": "super_secret_admin_key" }
      });
      status.classList.remove("hidden");
      if (res.ok) {
        status.className = "mt-2 rounded-md px-3 py-2 text-sm bg-emerald-900/80 text-emerald-100 border border-emerald-600";
        status.textContent = "Video ingested! The background worker will match the movie in ~10-15 seconds.";
      } else {
        status.className = "mt-2 rounded-md px-3 py-2 text-sm bg-red-900/80 text-red-100 border border-red-600";
        status.textContent = `Ingest failed (${res.status}).`;
      }
    });
  </script>
</body>
</html>
