services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: reaction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password_here
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      # Nested appsettings keys use double underscores in .NET.
      # Prefer a gitignored .env for real keys (see .env.example).
      ConnectionStrings__DefaultConnection: Host=db;Database=reaction_db;Username=postgres;Password=your_secure_password_here
      TmdbOptions__ApiKey: ${TMDB_API_KEY:-your_tmdb_key_here}
      AdminSettings__ApiKey: ${ADMIN_API_KEY:-change_me_admin_key}
      ASPNETCORE_ENVIRONMENT: Development

volumes:
  postgres_data:
